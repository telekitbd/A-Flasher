name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove leftover files from older versions (keep only com.aflasher)
        run: |
          J=app/src/main/java
          find "$J" -mindepth 1 -maxdepth 1 ! -name com -exec rm -rfv {} +
          find "$J/com" -mindepth 1 -maxdepth 1 ! -name aflasher -exec rm -rfv {} +
          rm -rfv app/src/main/kotlin app/src/androidTest app/src/test 2>/dev/null || true
          echo "Remaining packages:"; find "$J" -type d
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK (retry on Maven 429 / network errors)
        run: |
          for i in 1 2 3 4; do
            gradle assembleDebug --no-daemon && exit 0
            echo "Build attempt $i failed, retrying in $((i*40))s..."
            sleep $((i*40))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: A-Flasher-APK
          path: app/build/outputs/apk/debug/*.apk
