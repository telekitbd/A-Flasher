name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build debug APK (retry on Maven 429 / network errors)
        run: |
          for i in 1 2 3 4; do
            gradle assembleDebug --no-daemon && exit 0
            echo "Build attempt $i failed, retrying in $((i*40))s..."
            sleep $((i*40))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: A-Flasher-APK
          path: app/build/outputs/apk/debug/*.apk
